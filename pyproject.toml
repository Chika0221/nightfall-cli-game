[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightfall-cli-game"
version = "0.2.0"
description = "NIGHTFALL：ノアの亡命 — Windows / Ubuntu WSL 2 向けUnix CLI調査ゲーム"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mission = "nightfall.client:mission"
vault = "nightfall.client:vault"

[tool.setuptools]
packages = ["nightfall"]

[tool.setuptools.package-data]
nightfall = ["scenario.json"]
